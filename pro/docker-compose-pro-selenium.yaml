version: "3.8"

services:

  postgres-db:
    image: ghcr.io/cloudnative-pg/postgresql:16.2
    container_name: postgres-db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./../db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=healenium
      - POSTGRES_USER=healenium_user
      - POSTGRES_PASSWORD=YDk2nmNs4s9aCP6K
    networks:
      - healenium

  healenium-iam:
    image: aliakseiashukha/hlm-iam:EPMHLM-585-Healenium-IAM
    container_name: healenium-iam
    restart: on-failure
    ports:
      - "7070:7070"
    depends_on:
      - postgres-db
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=healenium
      - IAM_DB_USER=healenium_user
      - IAM_DB_PASSWORD=YDk2nmNs4s9aCP6K
      - IAM_AUTH_MODE=saas
      - AWS_REGION=us-east-1
      - COGNITO_USER_POOL_ID=us-east-1_CRsYigNOC
      - COGNITO_CLIENT_ID=6pqo3dnb78nkend0ehahlsm6e4
      - IAM_CACHE_TTL_SECONDS=300
    networks:
      - healenium

  healenium:
    image: aliakseiashukha/hlm-backend:EPMHLM-585-Healenium-IAM
    container_name: healenium
    restart: on-failure
    ports:
      - "7878:7878"
    links:
      - postgres-db
    environment:
      - SPRING_POSTGRES_DB=healenium
      - SPRING_POSTGRES_SCHEMA=healenium
      - SPRING_POSTGRES_USER=healenium_app
      - SPRING_POSTGRES_PASSWORD=healenium_app_password
      - SPRING_POSTGRES_DB_HOST=postgres-db
      - KEY_SELECTOR_URL=false
      - COLLECT_METRICS=true
      - FIND_ELEMENTS_AUTO_HEALING=false
      - HLM_LOG_LEVEL=info
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
    networks:
      - healenium

  selector-imitator:
    image: healenium/hlm-selector-imitator:1.6
    container_name: selector-imitator
    restart: on-failure
    ports:
      - "8000:8000"
    networks:
      - healenium

  hlm-proxy:
    image: aliakseiashukha/hlm-proxy:EPMHLM-585-Healenium-IAM
    container_name: hlm-proxy
    restart: on-failure
    ports:
      - "8085:8085"
    depends_on:
      - healenium-iam
      - healenium
    environment:
      - TEST_PLATFORM=selenium
      - RECOVERY_TRIES=1
      - SCORE_CAP=.6
      - HEAL_ENABLED=true
      - SELENIUM_SERVER_URL=http://selenium-hub:4444/wd/hub
      - HEALENIUM_SERVER_URL=http://healenium:7878
      - HEALENIUM_SERVICE=http://healenium:7878
      - IMITATE_SERVICE=http://selector-imitator:8000
      - HEALENIUM_AI_SERVICE=http://healenium-ai:6565
      - HEALENIUM_AUTH_ENABLED=true
      - HEALENIUM_IAM_URL=http://healenium-iam:7070
      - DEFAULT_TENANT_ID=
      - HLM_LOG_LEVEL=debug
    volumes:
      - ./logs/:/logs
    networks:
      - healenium

  healenium-ui-dashboard:
    image: aliakseiashukha/hlm-ui-dashboard:EPMHLM-585-Healenium-IAM
    container_name: hlm-ui-dashboard
    restart: on-failure
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
      - VITE_AUTH_ENABLED=true
      - VITE_DEFAULT_TENANT_ID=
      - VITE_COGNITO_DOMAIN=https://us-east-1crsyignoc.auth.us-east-1.amazoncognito.com
      - VITE_COGNITO_CLIENT_ID=6pqo3dnb78nkend0ehahlsm6e4
    networks:
      - healenium

  healenium-ai:
    image: aliakseiashukha/hlm-ai:EPMHLM-585-Healenium-IAM
    container_name: hlm-ai
    restart: on-failure
    ports:
      - "6565:6565"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - HEALENIUM_SERVICE=http://healenium:7878
      - SPRING_POSTGRES_DB_HOST=postgres-db
      - SPRING_POSTGRES_DB=healenium
      - SPRING_POSTGRES_USER=healenium_user
      - SPRING_POSTGRES_PASSWORD=YDk2nmNs4s9aCP6K
      - SPRING_POSTGRES_SCHEMA=healenium
    networks:
      - healenium

  chrome:
    image: selenium/node-chromium:latest
    container_name: node-chrome
    restart: on-failure
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=5
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=20
    networks:
      - healenium

#  edge:
#    image: selenium/node-edge:latest
#    container_name: node-edge
#    shm_size: 2gb
#    depends_on:
#      - selenium-hub
#    environment:
#      - SE_EVENT_BUS_HOST=selenium-hub
#      - SE_EVENT_BUS_PUBLISH_PORT=4442
#      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
#    networks:
#      - healenium

  firefox:
    image: selenium/node-firefox:latest
    container_name: node-firefox
    restart: on-failure
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - healenium

  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    restart: on-failure
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - healenium

networks:
  healenium:
    name: healenium
    external: true
